# H2 file-based DB - zero setup, and (unlike in-memory H2) survives backend restarts.
# Data is stored in ./data/medistock.mv.db relative to wherever you run the app from.
spring.datasource.url=jdbc:h2:file:./data/medistock
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# To reset all data, stop the app and delete the ./data folder.

# To use local MySQL instead, comment the H2 block above and uncomment below:
# spring.datasource.url=jdbc:mysql://localhost:3306/medistock?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
