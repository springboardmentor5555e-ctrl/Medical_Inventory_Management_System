# Database Configuration (Injected via Environment Variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Security
jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPIRATION:86400000}

# Application Port
server.port=8080

# Logging
logging.level.root=INFO
logging.level.com.medistock=INFO

# ─── Email / JavaMailSender (Production) ──────────────────────────────────────
medistock.email.alerts.enabled=${EMAIL_ALERTS_ENABLED:false}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
