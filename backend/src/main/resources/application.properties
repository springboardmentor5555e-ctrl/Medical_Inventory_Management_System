spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medistock}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

server.port=${PORT:8080}

security.jwt.secret=${JWT_SECRET}

# MediStock email notification setup
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM}
medistock.notification.admin-email=${ADMIN_EMAIL}
app.mail.admin-address=${ADMIN_EMAIL}

app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# SMTP configuration
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


